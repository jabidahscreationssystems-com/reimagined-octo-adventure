name: Agent Cortana
description: An intelligent GitHub agent for automating workflows and enhancing developer productivity
url: https://github.com/jabidahscreationssystems-com/reimagined-octo-adventure
hook_attributes:
  url: https://agent-cortana.example.com/webhooks
public: true
default_permissions:
  contents: write
  issues: write
  pull_requests: write
  metadata: read
  workflows: write
default_events:
  - issues
  - issue_comment
  - pull_request
  - pull_request_review
  - pull_request_review_comment
  - push
  - workflow_run
